name: main_pe
title: "Positional encodings under length, position, distance and distractors (Studies\
  \ 1, 2, 3, 5) \u2014 v2"
research_question: 'With a training recipe under which a 2-layer model learns GENUINE
  key-value retrieval (verified by counterfactual edits), how does retrieval accuracy
  depend on sequence length, evidence position, evidence-to-query distance and the
  number of distractor pairs, and how do six positional representations compare under
  identical model, data, budget and evaluation examples?

  '
hypothesis: '(H1) Models that learn the task retain high accuracy for in-range lengths
  at every evidence position. (H2) Beyond the training length (64), methods whose
  attention depends on absolute position (learned, sinusoidal) degrade more than translation-invariant
  ones (RoPE, T5 bias, ALiBi, NoPE); the learned table degrades most (untrained rows).
  (H3) More distractor pairs than trained (4) reduce accuracy. Each hypothesis can
  be falsified by the grids below.

  '
independent_variables:
- pos_method
- seq_len
- evidence_pos
- evidence_distance
- n_pairs
controlled_variables:
- 'architecture: 2 layers, d_model 64, 2 heads (d_h 32), d_mlp 256, pre-LN (identical
  attention code)'
- 'training data: 4 key-value pairs, keys and values from ONE shared vocabulary (no
  value-type shortcut), key-last queries, every pair queried with HIDDEN answers in
  75% of sequences (no elimination shortcut), lengths 24-64'
- steps (3000), batch size, optimiser, learning-rate schedule
- evaluation examples (shared eval_seed; cells paired within each grid)
primary_metric: exact-match accuracy of the answer token (single-query format)
expected_failure_modes:
- a method fails to learn in distribution (optimisation, not extrapolation) -> flagged
  by val acc < 0.9
- 'learned absolute table: untrained rows beyond the training length'
- 'sinusoidal: unseen absolute phase combinations at long lengths'
- 'T5 bias: all distances >= 128 share one bucket'
- 'ALiBi: fixed distance penalty limits long-range reads'
- 'NoPE: weak positional information; may not form the previous-token step'
- softmax dilution over more tokens at longer lengths; more candidates with more pairs
seeds:
- 0
- 1
- 2
eval_seed: 20261011
model:
  d_model: 64
  n_heads: 2
  n_layers: 2
  d_mlp: 256
  max_positions: 512
train_task:
  task: recall
  seq_len:
  - 24
  - 64
  n_pairs: 4
  n_lures: 0
  n_queries: all
  single_query_prob: 0.25
  query_format: key_last
  aux_show_answers: false
  value_vocab: shared
train:
  steps: 3000
  batch_size: 64
  lr: 0.003
  warmup_steps: 100
  min_lr_frac: 0.1
  eval_every: 100
  log_every: 50
  val_examples: 512
  checkpoint_steps:
  - 100
  - 200
  - 300
  - 500
  - 700
  - 1000
  - 1500
  - 2000
  - 3000
variants:
- name: rope
  model:
    pos_method: rope
- name: learned
  model:
    pos_method: learned
- name: sinusoidal
  model:
    pos_method: sinusoidal
- name: t5_relative
  model:
    pos_method: t5_relative
- name: alibi
  model:
    pos_method: alibi
- name: none
  model:
    pos_method: none
eval_grids:
- name: length
  vary:
    seq_len:
    - 32
    - 48
    - 64
    - 96
    - 128
    - 192
    - 256
  base:
    n_queries: 1
  n: 300
- name: length_x_position
  vary:
    seq_len:
    - 64
    - 128
    - 256
    evidence_pos:
    - 0.0
    - 0.25
    - 0.5
    - 0.75
    - 1.0
  base:
    n_queries: 1
  n: 200
- name: length_x_distance
  vary:
    seq_len:
    - 64
    - 128
    - 256
    evidence_distance:
    - 8
    - 24
    - 56
  base:
    n_queries: 1
  n: 200
- name: distractors
  vary:
    seq_len:
    - 64
    - 128
    n_pairs:
    - 1
    - 2
    - 4
    - 8
    - 12
    - 16
    - 24
  base:
    n_queries: 1
  n: 200
analyses:
  position_offset:
  - 0
  - 64
  - 192
  control_n: 400
  leakage_check: 5000
reference_variant: rope
scope_note: 'v2 of this study. v1 (results kept in experiments/results/main_pe_v1_elimination_confounded)
  was stopped after its training design was found to contain an elimination shortcut.
  v2 uses the only recipe found to produce genuine retrieval under variable length
  (calibration probe S3 and study value_type): a fixed number of training pairs (4);
  variable pair counts (2-8) were not learned within budget (probes S1/S2). Lures
  are omitted (undefined with a shared vocabulary). Mechanistic analysis on seed 0
  only.

  '
notes: ''
source_path: configs\study_main_pe.yaml
